<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <div class="popup">
        <header class="popup__header">
            <div class="popup__logo">
                <span class="popup__logo-icon">🍪</span>
                <div class="popup__logo-text">
                    <h1>Flavortown Utils</h1>
                    <span class="popup__version">Theme Manager</span>
                </div>
            </div>
        </header>

        <main class="popup__main">
            <section class="popup__themes">
                <div class="theme-card" data-theme="default">
                    <div class="theme-card__preview theme-card__preview--default">
                        <div class="theme-card__colors">
                            <span style="background: #fdf6e3"></span>
                            <span style="background: #5d4e37"></span>
                            <span style="background: #d97706"></span>
                        </div>
                    </div>
                    <div class="theme-card__info">
                        <span class="theme-card__name">Default</span>
                        <span class="theme-card__desc">Original Flavortown</span>
                    </div>
                    <div class="theme-card__check">✓</div>
                </div>

                <div class="theme-card" data-theme="catppuccin">
                    <div class="theme-card__preview theme-card__preview--catppuccin">
                        <div class="theme-card__colors">
                            <span style="background: #1e1e2e"></span>
                            <span style="background: #cba6f7"></span>
                            <span style="background: #f5c2e7"></span>
                        </div>
                    </div>
                    <div class="theme-card__info">
                        <span class="theme-card__name">Catppuccin</span>
                        <span class="theme-card__desc">Mocha dark theme</span>
                    </div>
                    <div class="theme-card__check">✓</div>
                </div>

                <div class="theme-card" data-theme="sea">
                    <div class="theme-card__preview theme-card__preview--sea">
                        <div class="theme-card__colors">
                            <span style="background: #0a192f"></span>
                            <span style="background: #66d9ef"></span>
                            <span style="background: #7fdbca"></span>
                        </div>
                    </div>
                    <div class="theme-card__info">
                        <span class="theme-card__name">Ocean</span>
                        <span class="theme-card__desc">Deep sea vibes</span>
                    </div>
                    <div class="theme-card__check">✓</div>
                </div>

                <div class="theme-card" data-theme="overcooked">
                    <div class="theme-card__preview theme-card__preview--overcooked">
                        <div class="theme-card__colors">
                            <span style="background: #1a0f0f"></span>
                            <span style="background: #ed8936"></span>
                            <span style="background: #c53030"></span>
                        </div>
                    </div>
                    <div class="theme-card__info">
                        <span class="theme-card__name">Overcooked</span>
                        <span class="theme-card__desc">Kitchen chaos</span>
                    </div>
                    <div class="theme-card__check">✓</div>
                </div>

                <div class="theme-card" data-theme="custom">
                    <div class="theme-card__preview theme-card__preview--custom" id="customPreview">
                        <div class="preview-bg" style="background: #1e1e2e; padding: 12px; border-radius: 8px;">
                            <div class="preview-surface" style="background: #313244; border: 1px solid #45475a; border-radius: 6px; padding: 8px; margin-bottom: 8px;">
                                <span style="color: #cdd6f4; font-size: 11px;">Sample text</span>
                            </div>
                            <div style="display: flex; gap: 6px; align-items: center;">
                                <span class="preview-btn" style="background: #cba6f7; color: #11111b; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;">Button</span>
                                <span class="preview-link" style="color: #89b4fa; font-size: 10px;">Link</span>
                            </div>
                        </div>
                    </div>
                    <div class="theme-card__info">
                        <span class="theme-card__name">Custom</span>
                        <span class="theme-card__desc">Your own colors</span>
                    </div>
                    <div class="theme-card__check">✓</div>
                </div>

                <div class="accent-toggle" id="accentToggle">
                    <div class="accent-toggle__label">Catppuccin Accent</div>
                    <div class="accent-toggle__options">
                        <button class="accent-toggle__btn active" data-accent="mauve">
                            <span class="accent-toggle__color" style="background: #cba6f7"></span>
                            Mauve
                        </button>
                        <button class="accent-toggle__btn" data-accent="lavender">
                            <span class="accent-toggle__color" style="background: #b4befe"></span>
                            Lavender
                        </button>
                    </div>
                </div>
            </section>

            <section class="popup__custom" id="customSection">
                <div class="custom-editor">
                    <div class="custom-editor__header">
                        <span>🎨 Color Editor</span>
                        <button class="custom-editor__reset" id="resetBtn"
                            title="Reset to Catppuccin defaults">↺</button>
                    </div>
                    <div class="custom-editor__grid" id="customVars"></div>
                </div>
            </section>
        </main>

        <footer class="popup__footer">
            <div class="popup__shortcut">
                <div class="popup__shortcut-label">Command Palette Shortcut</div>
                <div class="popup__shortcut-controls">
                    <button class="popup__shortcut-input" id="commandPaletteShortcut" type="button">Ctrl+K</button>
                    <button class="popup__shortcut-reset" id="commandPaletteShortcutReset" type="button">Reset</button>
                </div>
                <div class="popup__shortcut-hint">Press a key combo (Esc to cancel)</div>
            </div>
            <div class="popup__sync-toggle">
                <label class="popup__sync-toggle-label" for="autoSyncToggle">
                    <input type="checkbox" id="autoSyncToggle">
                    <span>Auto-sync local data</span>
                </label>
            </div>
            <div class="popup__sync">
                <button class="popup__sync-btn" id="exportBtn" type="button">Export Data</button>
                <label class="popup__sync-btn popup__sync-btn--ghost" for="importFile">Import Data</label>
                <input type="file" id="importFile" class="popup__sync-file" accept="application/json" tabindex="-1">
                <button class="popup__sync-btn popup__sync-btn--ghost" id="migrateSpicetownBtn" type="button">Migrate Spicetown Keys</button>
            </div>
            <div class="popup__cache">
                <button class="popup__cache-btn" id="clearCacheBtn" type="button">
                    <span class="popup__cache-icon">🧹</span>
                    Clear Cache & Refresh
                </button>
            </div>
            <div class="popup__status" id="status"></div>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>

</html>
